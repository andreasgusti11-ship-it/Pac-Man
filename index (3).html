<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man WASD</title>
<style>
  :root { color-scheme: dark; --bg:#070b1b; --panel:#101832; --blue:#285dff; --yellow:#ffe34d; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:18px;
    background:radial-gradient(circle at top,#182654 0,#070b1b 60%); color:#f4f7ff;
    font-family:system-ui,-apple-system,Segoe UI,sans-serif; }
  .wrap { width:min(100%,680px); text-align:center; }
  h1 { margin:0 0 5px; letter-spacing:3px; color:var(--yellow); text-shadow:0 0 18px #ffda3d66; }
  .sub { margin:0 0 16px; color:#aebbe2; font-size:.95rem; }
  .hud { display:flex; justify-content:space-between; gap:10px; margin:0 auto 10px; max-width:560px; }
  .stat { flex:1; padding:10px 12px; background:var(--panel); border:1px solid #293963; border-radius:12px; }
  .stat small { display:block; color:#aebbe2; font-size:.75rem; text-transform:uppercase; letter-spacing:1px; }
  .stat strong { font-size:1.25rem; }
  canvas { display:block; width:min(100%,560px); height:auto; margin:auto; background:#050916; border:2px solid #315bff;
    border-radius:12px; box-shadow:0 0 28px #2457ff30; image-rendering:pixelated; }
  .controls { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px; margin:14px auto 8px; }
  button { cursor:pointer; color:white; background:#1b2a53; border:1px solid #4266b8; border-radius:10px; padding:10px 16px;
    font-weight:700; font-size:.95rem; }
  button:hover { background:#2b4380; }
  .help { color:#aebbe2; font-size:.86rem; line-height:1.6; }
  kbd { display:inline-block; padding:2px 6px; border:1px solid #6275a5; border-radius:5px; background:#172344; color:#fff; }
  .pad { display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(2,42px); gap:5px; margin:10px auto 0; width:max-content; }
  .pad button { padding:0; font-size:1.1rem; touch-action:manipulation; }
  .pad .up { grid-column:2; grid-row:1; } .pad .left { grid-column:1; grid-row:2; }
  .pad .down { grid-column:2; grid-row:2; } .pad .right { grid-column:3; grid-row:2; }
  @media (min-width:700px) { .pad { display:none; } }
</style>
</head>
<body>
<main class="wrap">
  <h1>ᗧ PAC-MAN</h1>
  <p class="sub">Makan semua titik, hindari hantu, dan raih skor tertinggi!</p>
  <div class="hud">
    <div class="stat"><small>Skor</small><strong id="score">0</strong></div>
    <div class="stat"><small>Nyawa</small><strong id="lives">3</strong></div>
    <div class="stat"><small>Status</small><strong id="status">Siap!</strong></div>
  </div>
  <canvas id="game" width="560" height="640" aria-label="Permainan Pac-Man"></canvas>
  <div class="controls">
    <button id="start">▶ Mulai / Lanjut</button>
    <button id="restart">↻ Ulangi</button>
    <button id="pause">Ⅱ Jeda</button>
  </div>
  <p class="help">Kontrol: <kbd>W</kbd> atas · <kbd>A</kbd> kiri · <kbd>S</kbd> bawah · <kbd>D</kbd> kanan<br>Di HP, gunakan tombol arah di bawah.</p>
  <div class="pad" aria-label="Kontrol arah">
    <button class="up" data-dir="up" aria-label="Atas">▲</button>
    <button class="left" data-dir="left" aria-label="Kiri">◀</button>
    <button class="down" data-dir="down" aria-label="Bawah">▼</button>
    <button class="right" data-dir="right" aria-label="Kanan">▶</button>
  </div>
</main>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const statusEl = document.getElementById('status');

  // # = tembok, . = titik, P = Pac-Man, G = hantu
  const originalMap = [
    "##################",
    "#P.....#....#....#",
    "#.##.#.#.##.#.##.#",
    "#o...#......#...o#",
    "###.###.##.###.###",
    "#...#...##...#...#",
    "#.###.#....#.###.#",
    "#.....#.##.#.....#",
    "###.#......#.##.##",
    "#...#.##..##.#...#",
    "#.###.#....#.###.#",
    "#.....#.GG.#.....#",
    "##.##.#....#.##.##",
    "#....#......#....#",
    "#.##.#.####.#.##.#",
    "#o...#......#...o#",
    "#.####.####.####.#",
    "#................#",
    "##################"
  ];
  const TILE = 28, COLS = 18, ROWS = 19;
  let map, pac, ghosts, score, lives, running, gameOver, win, lastTime=0, moveTimer=0;
  const dirs = {
    up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}
  };
  function reset() {
    map = originalMap.map(r => r.split(''));
    pac = {x:1,y:1,dir:'right',want:'right'};
    ghosts = [
      {x:8,y:11,dir:'left',color:'#ff5364',homeX:8,homeY:11},
      {x:9,y:11,dir:'right',color:'#4de7ff',homeX:9,homeY:11}
    ];
    score=0; lives=3; running=false; gameOver=false; win=false; moveTimer=0;
    // Remove spawn symbols from the walkable map.
    map[1][1]='.';
    map[11][8]='.'; map[11][9]='.';
    // Count all collectible dots.
    updateHud('Siap!');
    draw();
  }
  function updateHud(status) {
    scoreEl.textContent=score; livesEl.textContent=lives; statusEl.textContent=status;
  }
  function wall(x,y) {
    return x<0 || y<0 || x>=COLS || y>=ROWS || map[y][x]==='#';
  }
  function movePac() {
    const next=dirs[pac.want];
    if (next && !wall(pac.x+next.x,pac.y+next.y)) pac.dir=pac.want;
    const d=dirs[pac.dir];
    if (!wall(pac.x+d.x,pac.y+d.y)) { pac.x+=d.x; pac.y+=d.y; }
    const tile=map[pac.y][pac.x];
    if (tile==='.' || tile==='o') {
      score += tile==='o' ? 50 : 10;
      map[pac.y][pac.x]='.';
      if (!map.some(row=>row.some(c=>c==='.'||c==='o'))) {
        win=true; running=false; updateHud('Menang!');
      }
    }
  }
  function moveGhost(g) {
    const options=Object.keys(dirs).filter(k => !wall(g.x+dirs[k].x,g.y+dirs[k].y));
    if (!options.length) return;
    // Hantu kadang mengejar, kadang memilih arah acak agar permainan terasa dinamis.
    let choice;
    if (Math.random()<0.68) {
      options.sort((a,b) => {
        const da=dirs[a], db=dirs[b];
        const sa=Math.abs(g.x+da.x-pac.x)+Math.abs(g.y+da.y-pac.y);
        const sb=Math.abs(g.x+db.x-pac.x)+Math.abs(g.y+db.y-pac.y);
        return sa-sb;
      });
      choice=options[0];
    } else choice=options[Math.floor(Math.random()*options.length)];
    // Hindari putar balik bila ada pilihan lain.
    if (options.length>1 && choice===({up:'down',down:'up',left:'right',right:'left'})[g.dir]) {
      const alternatives=options.filter(k=>k!==choice);
      choice=alternatives[Math.floor(Math.random()*alternatives.length)];
    }
    g.dir=choice; g.x+=dirs[choice].x; g.y+=dirs[choice].y;
  }
  function checkCollision() {
    for (const g of ghosts) {
      if (g.x===pac.x && g.y===pac.y) {
        lives--;
        if (lives<=0) {
          running=false; gameOver=true; updateHud('Game Over');
        } else {
          pac.x=1; pac.y=1; pac.dir='right'; pac.want='right';
          ghosts[0].x=8; ghosts[0].y=11; ghosts[1].x=9; ghosts[1].y=11;
          running=false; updateHud('Kena! Mulai lagi');
        }
        return;
      }
    }
  }
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#050916'; ctx.fillRect(0,0,canvas.width,canvas.height);
    for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++) {
      const px=x*TILE, py=y*TILE, t=map[y][x];
      if (t==='#') {
        ctx.fillStyle='#1639c8'; ctx.fillRect(px+1,py+1,TILE-2,TILE-2);
        ctx.strokeStyle='#4d7bff'; ctx.lineWidth=1; ctx.strokeRect(px+3,py+3,TILE-6,TILE-6);
      } else if (t==='.' || t==='o') {
        ctx.beginPath(); ctx.fillStyle=t==='o'?'#fff2a1':'#ffe8b4';
        ctx.arc(px+TILE/2,py+TILE/2,t==='o'?5:2.6,0,Math.PI*2); ctx.fill();
      }
    }
    // Pac-Man
    const cx=pac.x*TILE+TILE/2, cy=pac.y*TILE+TILE/2;
    const angle={right:0,left:Math.PI,up:-Math.PI/2,down:Math.PI/2}[pac.dir]||0;
    const mouth=0.22+Math.abs(Math.sin(Date.now()/90))*0.22;
    ctx.beginPath(); ctx.fillStyle='#ffe34d';
    ctx.moveTo(cx,cy); ctx.arc(cx,cy,TILE*0.42,angle+mouth,angle+Math.PI*2-mouth); ctx.closePath(); ctx.fill();
    // Ghosts
    for (const g of ghosts) {
      const gx=g.x*TILE+TILE/2, gy=g.y*TILE+TILE/2, r=TILE*0.39;
      ctx.fillStyle=g.color; ctx.beginPath(); ctx.arc(gx,gy-2,r,Math.PI,0); ctx.lineTo(gx+r,gy+r);
      ctx.lineTo(gx+r*0.45,gy+r*0.65); ctx.lineTo(gx,gy+r); ctx.lineTo(gx-r*0.45,gy+r*0.65);
      ctx.lineTo(gx-r,gy+r); ctx.closePath(); ctx.fill();
      ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(gx-4,gy-2,4,0,Math.PI*2); ctx.arc(gx+5,gy-2,4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#14204a'; ctx.beginPath(); ctx.arc(gx-3,gy-1,1.8,0,Math.PI*2); ctx.arc(gx+6,gy-1,1.8,0,Math.PI*2); ctx.fill();
    }
    if (!running) {
      ctx.fillStyle='#030714c9'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.textAlign='center'; ctx.fillStyle='#ffe34d'; ctx.font='bold 28px system-ui';
      const headline=win?'KAMU MENANG!':gameOver?'GAME OVER':'PAC-MAN';
      ctx.fillText(headline,canvas.width/2,canvas.height/2-8);
      ctx.fillStyle='#ffffff'; ctx.font='15px system-ui';
      const message=win?'Semua titik berhasil dimakan!':gameOver?'Tekan Ulangi untuk mencoba lagi':'Tekan Mulai atau tombol WASD';
      ctx.fillText(message,canvas.width/2,canvas.height/2+24);
    }
  }
  function tick(time) {
    requestAnimationFrame(tick);
    const dt=Math.min(time-lastTime,100); lastTime=time;
    if (running) {
      moveTimer+=dt;
      if (moveTimer>145) {
        moveTimer=0; movePac();
        if (running || (!win && !gameOver)) ghosts.forEach(moveGhost);
        checkCollision();
        if (running) updateHud('Main');
      }
    }
    draw();
  }
  function start() {
    if (gameOver || win) return;
    running=true; updateHud('Main');
  }
  function setDir(d) {
    pac.want=d;
    if (!running && !gameOver && !win) start();
  }
  document.addEventListener('keydown', e => {
    const key=e.key.toLowerCase();
    const keyMap={w:'up',a:'left',s:'down',d:'right',arrowup:'up',arrowleft:'left',arrowdown:'down',arrowright:'right'};
    if (keyMap[key]) { e.preventDefault(); setDir(keyMap[key]); }
    if (key===' ' ) { e.preventDefault(); running ? (running=false,updateHud('Jeda')) : start(); }
  });
  document.getElementById('start').addEventListener('click',start);
  document.getElementById('restart').addEventListener('click',reset);
  document.getElementById('pause').addEventListener('click',()=>{ if (running) {running=false;updateHud('Jeda');} else start(); });
  document.querySelectorAll('[data-dir]').forEach(b=>{
    b.addEventListener('click',()=>setDir(b.dataset.dir));
    b.addEventListener('touchstart',e=>{e.preventDefault();setDir(b.dataset.dir);},{passive:false});
  });
  reset();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
